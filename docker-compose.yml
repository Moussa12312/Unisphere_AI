version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Base de données PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: unisphere_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unisphere_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unisphere_secret_2026_moussa}
      POSTGRES_DB: ${POSTGRES_DB:-unisphere_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unisphere_admin} -d ${POSTGRES_DB:-unisphere_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unisphere_network

  # ---------------------------------------------------------------------------
  # 2. Backend FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unisphere_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-unisphere_admin}:${POSTGRES_PASSWORD:-unisphere_secret_2026_moussa}@postgres:5432/${POSTGRES_DB:-unisphere_db}
      SECRET_KEY: ${SECRET_KEY:-c9284fae98214dbac91823746182937461928374}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://169.58.101.183}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@unisphere.ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_UPLOAD_SIZE_MB: 25
      UPLOAD_DIR: ./uploads
      QR_DIR: ./qr_codes
      DOCUMENTS_DIR: ./documents
      APP_NAME: "UniSphere AI"
      APP_VERSION: "2.0.0"
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - backend_uploads:/app/uploads
      - backend_qrcodes:/app/qr_codes
    networks:
      - unisphere_network

  # ---------------------------------------------------------------------------
  # 3. Frontend Next.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: unisphere_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    networks:
      - unisphere_network

  # ---------------------------------------------------------------------------
  # 4. Reverse Proxy Nginx & Passerelle HTTP
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: unisphere_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - unisphere_network

volumes:
  postgres_data:
  backend_uploads:
  backend_qrcodes:
  certbot_etc:

networks:
  unisphere_network:
    driver: bridge
